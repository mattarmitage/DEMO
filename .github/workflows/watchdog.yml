name: Delivery watchdog

on:
  schedule:
    - cron: "0 7 * * 1-5"   # weekdays, 07:00 UTC
  workflow_dispatch:         # lets you run it manually from the Actions tab

permissions:
  contents: read
  pull-requests: read

jobs:
  stale-ticket-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Run watchdog (read-only)
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_PROJECT: DEMO   # not sensitive, so not a secret (secrets get masked as *** in logs)
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
        run: python watchdog.py --days 3

      - uses: actions/upload-artifact@v4
        with:
          name: watchdog-report
          path: report.md
